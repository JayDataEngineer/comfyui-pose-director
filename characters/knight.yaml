character:
  name: knight
  description: "tall stoic knight in weathered plate armor, scarred face, short grey hair"

generation:
  source: generate
  quality: turbo
  seed: 200
  prompt: >
    90s OVA anime cel of a tall muscular knight in weathered steel plate armor,
    visible dents and scratches on the breastplate, gauntlets, and greaves. A faded
    blue surcoat with a worn heraldic emblem over the armor. Thick neck, short
    salt-and-pepper hair, a diagonal scar across the left cheek, steely grey eyes
    with a stoic resolute expression. Dark leather boots. Arms at sides, standing
    at attention. Clean white background. Cel-shaded animation, visible paint strokes,
    muted cool color palette, anime screencap from 1991.

packages:
  portraits:
    emotions: [neutral, angry, determined]

  sprites:
    outfit: default
    directions: [front]
    animations:
      - name: idle
        motion: shared
      - name: walk
        motion: shared
      - name: die
        motion: shared
