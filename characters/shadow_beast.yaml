# T1.5 — imported shadow beast, shared-motion animations
character:
  name: shadow_beast
  description: "large quadruped shadow creature, glowing red eyes, wispy dark form"
  tier: t1.5

generation:
  source: import
  image: ../reference/shadow_beast_concept.png

packages:
  portraits:
    emotions: [neutral, angry]

  sprites:
    outfit: default
    directions: [front, back, left, right]
    static: true
    animated:
      - name: idle
        motion: shared
      - name: attack
        motion: shared
      - name: die
        motion: shared
