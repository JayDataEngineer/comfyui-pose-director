version: "3"

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm install

  dev:
    desc: Start dev server (http://localhost:3000)
    deps: [install]
    cmds:
      - npm run dev

  build:
    desc: Production build
    deps: [install]
    cmds:
      - npm run build

  start:
    desc: Serve production build
    cmds:
      - npm run start

  clean:
    desc: Remove build artifacts and node_modules
    cmds:
      - rm -rf .next out node_modules

  lint:
    desc: Run linter
    cmds:
      - npm run lint
